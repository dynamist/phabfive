# Nothing reaches phorge pods except Traefik (to Phorge), Phorge (to MariaDB)
# and the dev applications that read Phorge over Conduit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phorge-from-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 80
---
# Conduit clients inside the cluster. Dynatron's standup reports search
# Phorge from the hub and the worker, and a pod cannot go out through
# Traefik to come back in: `phorge.localhost` resolves to the pod itself,
# and reaching Traefik's ClusterIP directly would mean pinning an address
# that changes when the cluster is recreated. So the clients are named
# here, where a destination's ingress belongs, rather than worked around
# at the caller, and they use PHAB_URL=http://web.phorge.svc.cluster.local/api/
# - PHORGE_ALLOWED_URIS is what makes Phorge answer to that name.
#
# Namespace-scoped rather than pod-scoped on purpose: it grants the dev
# app, not a particular Deployment, so a second consumer there needs no
# change. And it selects on the dev-app label rather than the namespace
# name, because Dynatron runs one instance per git worktree - `dynatron`
# for the main checkout, `dynatron-<slug>` for each worktree - and every
# one of them carries `dynamist.se/dev-app: dynatron`, so a new worktree is
# admitted without a change here. The cost: the API server sets
# `kubernetes.io/metadata.name`, but anyone who can create a namespace can
# set this label - in a local dev cluster the same people who could edit
# this policy, so it widens nothing real. Port 80 only, which is all
# Conduit uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phorge-from-dev-apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              dynamist.se/dev-app: dynatron
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-phorge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: phorge
      ports:
        - port: 3306
