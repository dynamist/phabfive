---
name: Kubernetes

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBECTL: mise exec -- kubectl --context k3d-dynamist-dev

jobs:
  # Deploying costs about four minutes of k3d, and coexistence far more, so a
  # pull request only pays for it when it changes something that can break the
  # deployment, or when it carries the ci:k8s label.
  #
  # The label, and not a /command comment, is deliberately the manual override:
  # it is sticky, so it survives later pushes and "Re-run failed jobs", it is
  # visible in the pull request header, and it keeps the safe pull_request
  # event. An issue_comment trigger would instead run the default branch's copy
  # of this file with a writable token, and report no check on the pull request.
  decide:
    name: Should we deploy?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ci:k8s') }}
        run: |
          set -euo pipefail

          decide() {
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT" != pull_request ]; then
            decide true "Deploying: a $EVENT run is never gated."
          fi

          if [ "$LABELLED" = true ]; then
            decide true 'Deploying: the pull request is labelled `ci:k8s`.'
          fi

          if [ "$DRAFT" = true ]; then
            decide false 'Skipped: draft pull request. Mark it ready for review, or label it `ci:k8s`.'
          fi

          # Fail open. Four minutes wasted is cheaper than a deployment break
          # that reaches master because the API blipped and the gate said no.
          if ! changed=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename'); then
            decide true 'Deploying: could not list the changed files, so not guessing.'
          fi

          # Everything that changes what is deployed, or what the tests drive.
          # ci-test runs tests/k8s and tests/e2e, and the latter installs and
          # calls the CLI, which is why phabfive/ and the lock file are here.
          if hits=$(printf '%s\n' "$changed" | grep -E \
              -e '^(k8s|phorge|phabfive)/' \
              -e '^tests/(k8s|e2e)/' \
              -e '^(Makefile|mise\.toml|pyproject\.toml|uv\.lock)$' \
              -e '^\.github/workflows/k8s\.yml$'); then
            decide true "$(printf 'Deploying, because these changed files affect it:\n\n```\n%s\n```\n' "$hits")"
          fi

          decide false 'Skipped: nothing affecting the deployment changed. Label the PR `ci:k8s` to run it anyway.'

  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: make validate

  deploy:
    name: Deploy and test in k3d
    runs-on: ubuntu-latest
    needs: [validate, decide]
    if: needs.decide.outputs.deploy == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Deploy
        run: make ci-deploy

      # Do not depend on the runner's resolver for *.localhost
      - name: Resolve the ingress hostnames
        run: |
          hosts=$($KUBECTL get ingress -A -o jsonpath='{.items[*].spec.rules[*].host}')
          echo "127.0.0.1 $hosts nope.localhost" | sudo tee -a /etc/hosts

      - name: Test
        run: make ci-test

      - name: Collect diagnostics
        if: failure()
        run: &diagnostics |
          mkdir -p diagnostics
          $KUBECTL get all,ingress,pvc,netpol,events -A -o wide > diagnostics/resources.txt 2>&1 || true
          for ns in $($KUBECTL get ns -l dynamist.se/dev-app -o jsonpath='{.items[*].metadata.name}') kube-system; do
            $KUBECTL -n "$ns" describe pods > "diagnostics/$ns-pods.txt" 2>&1 || true
            for pod in $($KUBECTL -n "$ns" get pods -o name); do
              $KUBECTL -n "$ns" logs "$pod" --all-containers > "diagnostics/$ns-${pod#pod/}.log" 2>&1 || true
            done
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k8s-diagnostics
          path: diagnostics/

      - name: Delete cluster
        if: always()
        run: make destroy FORCE=1

  # Deploys the apps in the repository variable COEXISTENCE_REPOS (space
  # separated owner/name) into the same cluster, and runs every app's tests.
  # Each of them must provide the make targets ci-deploy and ci-test.
  coexistence:
    name: Coexistence with other apps in one cluster
    runs-on: ubuntu-latest
    needs: [validate, decide]
    if: vars.COEXISTENCE_REPOS != '' && needs.decide.outputs.deploy == 'true'
    timeout-minutes: 120
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: self

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Check out the other apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in ${{ vars.COEXISTENCE_REPOS }}; do
            gh repo clone "$repo" "apps/${repo#*/}" -- --depth 1
            # The cluster contract must be identical in every repo
            diff self/k8s/cluster/k3d.yaml "apps/${repo#*/}/k8s/cluster/k3d.yaml"
          done

      - name: Deploy all apps
        run: |
          make -C self ci-deploy
          for app in apps/*/; do mise install -C "$app" && make -C "$app" ci-deploy; done

      - name: Resolve the ingress hostnames
        working-directory: self
        run: |
          hosts=$($KUBECTL get ingress -A -o jsonpath='{.items[*].spec.rules[*].host}')
          echo "127.0.0.1 $hosts nope.localhost" | sudo tee -a /etc/hosts

      - name: Test all apps, including isolation from each other
        run: |
          make -C self ci-test
          for app in apps/*/; do make -C "$app" ci-test; done

      - name: Collect diagnostics
        if: failure()
        working-directory: self
        run: *diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coexistence-diagnostics
          path: self/diagnostics/

      - name: Delete cluster
        if: always()
        run: make -C self destroy FORCE=1
