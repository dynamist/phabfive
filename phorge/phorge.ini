date.timezone = UTC
opcache.validate_timestamps = 0
post_max_size = 64M
upload_max_filesize = 64M

; A notice PHP raises before Phorge's own error handler is installed would
; otherwise be printed into the response, ahead of the JSON of every Conduit
; call. Log it to the pod log instead, as a production php.ini does.
display_errors = Off
log_errors = On

; One of the paths of CVE-2026-109619 (PHP2Shell). Phorge manages its own
; sessions and never uses it. The fix is a patched PHP, which the php-8.0
; stage will never get (see docs/phorge-setup.md), so this only narrows it.
session.upload_progress.enabled = Off
