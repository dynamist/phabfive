---
name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # A pull request that only changes documentation runs one leg instead of
  # fifteen: Ubuntu on 3.13, which still runs the tests that read the docs
  # (tests/test_no_stale_paths.py and friends), lint, and the docs build. A
  # push to main always runs everything.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs-only: ${{ steps.scope.outputs.docs-only }}
    steps:
      - name: Decide
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          scope() {
            echo "$2" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "docs-only=$1" >>"$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT" != pull_request ]; then
            scope false "Every test: a $EVENT run always runs them all."
          fi

          # Fail open, a full run is cheaper than a break that reaches main
          # A rename counts under its old path too: moving phabfive/SKILL.md to
          # docs/ removes a file the package ships, wherever it lands
          if ! changed=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
            scope false "Every test: could not list the changed files, so not guessing."
          fi

          # Documentation that is not part of the package. phabfive/SKILL.md
          # is, so it is not in here
          if code=$(printf '%s\n' "$changed" | grep -vE \
              -e '^docs/' \
              -e '^mkdocs\.yml$' \
              -e '^[^/]+\.md$' \
              -e '^\.github/(ISSUE_TEMPLATE/|PULL_REQUEST_TEMPLATE\.md$)'); then
            scope false "$(printf 'Every test, because these changed files are not only documentation:\n\n```\n%s\n```\n' "$code")"
          fi

          scope true "Ubuntu on 3.13 only: the pull request only changes documentation."

  test:
    name: >-
      ${{ matrix.os }} v${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: scope
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.docs-only == 'true' && '["ubuntu-latest"]' || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ${{ fromJSON(needs.scope.outputs.docs-only == 'true' && '["3.13"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Run linting (Python 3.13 only)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: |
          uv run ruff check phabfive/ tests/
          uv run ruff format --check phabfive/ tests/
          uv run mypy

      # A broken link or a page missing from the nav fails here, not on the site
      - name: Build the docs (Python 3.13 only)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run --group docs mkdocs build --strict

  fresh-install:
    name: Fresh unlocked install v${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: scope
    # Documentation changes nothing an install resolves
    if: needs.scope.outputs.docs-only != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range. 3.10 also matters because
        # tests/test_declared_dependencies.py skips there for want of
        # tomllib, so on that leg this is the only cover.
        python-version: ["3.10", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately plain pip, not uv: uv sync installs uv.lock, which
      # pinned a typer old enough to still pull click in and hid the
      # undeclared dependency from every other job. This resolves from
      # pyproject alone, the way a release does.
      - name: Install into a clean venv, unlocked
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/python -m pip install --upgrade pip
          /tmp/fresh/bin/pip install .

      - name: Smoke test
        run: python scripts/smoke.py --venv /tmp/fresh
