# Which credentials the deployment uses - names and types, never secrets.
#
#   phabfive search -f specs/search/deploy-credentials.yaml
#
# `--show-secret` is refused for a spec-driven search, so a credential's
# value never leaves the instance because a file said so.
spec: phorge/v1alpha1
kind: search
metadata:
  name: deploy-credentials
  description: >-
    Deployment credentials by name and type. Phorge publishes no constraint
    on passphrase.query, so every filter here is applied in phabfive after
    reading the page - the limit is small on purpose, because a large one
    walks every credential the caller can see.
  version: "1"
  author: phabfive

searches:
  - type: passphrase
    title: Deployment credentials
    description: |
      `type:` inside `search:` is the credential type - password, token,
      key or note. `type:` beside `search:` is the object the item
      searches. They are two different keys that happen to share a name,
      one nested inside the other.

      Adding `text_query: deploy` narrows it further. That match is made
      in phabfive over the names and descriptions already read, not by
      the server, so it costs nothing extra - and finds nothing extra
      either, because there was never a query to push down.
    search:
      type: key
      limit: 10
