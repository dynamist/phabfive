---
name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every artifact is named after pyproject.toml while the release is named
  # after the tag, so a disagreement publishes a release full of artifacts for
  # another version -- which is how v0.10.0-rc.1 went out over a pyproject.toml
  # that still read 0.10.0-dev.0, with every job green. Its own job, gating the
  # builds, so the answer arrives in seconds rather than after six PyInstaller
  # runs and two image builds. The smoke tests below check the same thing again
  # from the other end, against the version the built artifact reports.
  check-version:
    name: Check the tag matches pyproject.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with the declared version
        run: python3 scripts/check_version.py "$GITHUB_REF_NAME"

  build:
    name: Build distribution
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Build package
        run: uv build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  build-executables:
    name: Build ${{ matrix.os }} ${{ matrix.arch }} executable
    needs: check-version
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # AMD64 builds
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            artifact_name: phabfive
            asset_name: phabfive-linux-amd64
          # macos-14 and macos-latest are both arm64 labels, so this row used
          # to build an arm64 binary and publish it as phabfive-macos-amd64 --
          # "Bad CPU type in executable" on the Intel Macs it was meant for.
          # macos-15-intel is the x86_64 image, and the last one Actions will
          # offer: it goes away in August 2027.
          - os: macos
            arch: amd64
            runner: macos-15-intel
            artifact_name: phabfive
            asset_name: phabfive-macos-amd64
          - os: windows
            arch: amd64
            runner: windows-latest
            artifact_name: phabfive.exe
            asset_name: phabfive-windows-amd64.exe
          # ARM64 builds
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            artifact_name: phabfive
            asset_name: phabfive-linux-arm64
          # Pinned rather than macos-latest: a release binary should be built
          # on the oldest macOS it targets, and the alias raises that floor
          # silently whenever GitHub moves it.
          - os: macos
            arch: arm64
            runner: macos-15
            artifact_name: phabfive
            asset_name: phabfive-macos-arm64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            artifact_name: phabfive.exe
            asset_name: phabfive-windows-arm64.exe
            skip_signing: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Cosign
        if: ${{ !matrix.skip_signing }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install .

      - name: Build executable
        shell: bash
        run: |
          echo "from phabfive.cli import cli_entrypoint; cli_entrypoint()" > _entry.py
          pyinstaller --onefile --name phabfive _entry.py \
            --collect-data phabfive \
            --collect-data rich \
            --copy-metadata rich \
            --collect-data phabricator \
            --hidden-import phabricator \
            --hidden-import anyconfig.backend.yaml \
            --hidden-import phabfive.cli.maniphest \
            --hidden-import phabfive.cli.diffusion \
            --hidden-import phabfive.cli.passphrase \
            --hidden-import phabfive.cli.paste \
            --hidden-import phabfive.cli.user \
            --hidden-import phabfive.cli.repl \
            --hidden-import phabfive.cli.completers \
            --exclude-module mkdocs

      - name: Rename artifact
        shell: bash
        run: mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      # The asset name is the only thing a user picking a download has to go
      # on, and until now nothing tied it to what was actually built: v0.10.0
      # published an arm64 binary as phabfive-macos-amd64, because macos-14 is
      # an arm64 label. The smoke test below cannot see this -- it runs the
      # binary on the machine that built it, which is native whatever that
      # machine is -- so the header is read instead.
      - name: Check the executable matches its name
        shell: bash
        run: python scripts/check_arch.py --expect ${{ matrix.arch }} dist/${{ matrix.asset_name }}

      # v0.10.0-rc.1 shipped six executables that could not start, and every
      # job still reported success, because nothing ran what it built. Each
      # runner is native for its arch, so this tests the binary on the
      # platform it targets.
      - name: Smoke test executable
        shell: bash
        run: |
          python scripts/smoke.py --executable dist/${{ matrix.asset_name }} \
            --expect-version "${GITHUB_REF_NAME#v}"

      - name: Sign executable with Sigstore
        if: ${{ !matrix.skip_signing }}
        shell: bash
        run: |
          cosign sign-blob dist/${{ matrix.asset_name }} \
            --bundle dist/${{ matrix.asset_name }}.sigstore.json \
            --yes

      - name: Upload executable and signature
        if: ${{ !matrix.skip_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sigstore.json

      - name: Upload executable (unsigned)
        if: ${{ matrix.skip_signing }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  build-image:
    name: Build ${{ matrix.libc }} container image
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: gnu
            suffix: ""
          - libc: musl
            suffix: "-musl"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: LIBC=${{ matrix.libc }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.libc }}
          cache-to: type=gha,mode=max,scope=${{ matrix.libc }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Sigstore
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  verify-wheel:
    name: Verify ${{ matrix.package }} on ${{ matrix.os }} v${{ matrix.python-version }}
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        package: [wheel]
        include:
          # An sdist that will not build breaks pip install for anyone
          # without a matching wheel, and nothing else here would notice.
          - os: ubuntu-latest
            python-version: "3.14"
            package: sdist
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      # Plain pip on purpose. uv would apply uv.lock and the exclude-newer
      # window; pip resolves from the distribution's own metadata, which is
      # exactly what someone running "pip install phabfive" gets.
      - name: Install the built distribution into a clean venv
        shell: bash
        run: |
          if [ "${{ matrix.package }}" = "sdist" ]; then
            artifact=$(ls dist/*.tar.gz)
          else
            artifact=$(ls dist/*.whl)
          fi
          echo "installing $artifact"
          python -m venv fresh
          if [ -d fresh/Scripts ]; then
            fresh/Scripts/python -m pip install --upgrade pip
            fresh/Scripts/pip install --no-cache-dir "$artifact"
          else
            fresh/bin/python -m pip install --upgrade pip
            fresh/bin/pip install --no-cache-dir "$artifact"
          fi

      - name: Smoke test
        shell: bash
        run: |
          python scripts/smoke.py --venv fresh \
            --expect-version "${GITHUB_REF_NAME#v}"

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify-wheel, build-executables]
    if: ${{ !contains(github.ref_name, '-rc') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phabfive
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub Release
    needs: [check-version, build, verify-wheel, publish-pypi, build-executables]
    # always() means an unlisted job is not a gate at all -- every job this
    # release depends on has to be named here explicitly.
    if: ${{ always() && needs.check-version.result == 'success' && needs.build.result == 'success' && needs.verify-wheel.result == 'success' && needs.build-executables.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          # Copy Python distributions
          cp artifacts/python-package-distributions/* release-assets/
          # Copy executables
          for dir in artifacts/phabfive-*/; do
            cp "$dir"* release-assets/ 2>/dev/null || true
          done
          ls -la release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            release-assets/*
