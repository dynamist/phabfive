# Keeps Phorge from starving other apps in the shared cluster
apiVersion: v1
kind: ResourceQuota
metadata:
  name: phorge
spec:
  hard:
    pods: "10"
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 6Gi
    persistentvolumeclaims: "5"
    requests.storage: 30Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: phorge
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
