[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phabfive"
version = "0.10.0-rc.4"
description = "CLI for Phabricator and Phorge - built for humans and AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rickard Eriksson", email = "rickard@dynamist.se" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
]
dependencies = [
  "anyconfig>=0.10.0",
  "appdirs>=1.4.0",
  # Imported directly by phabfive.cli.shell_completion. It used to arrive
  # through typer, which dropped it as a dependency in 0.27.
  "click>=8.0",
  "InquirerPy>=0.3.4",
  "jinja2>=3.0.0",
  "phabricator>=0.7.0",
  "pyyaml>=6.0",
  # Imported directly by the CLI modules to catch connection errors. It
  # arrives through phabricator today, which is not a promise it keeps.
  "requests>=2.26",
  "rich>=13.0.0",
  "ruamel-yaml>=0.18.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
repl = ["ptpython>=3.0.32"]

[dependency-groups]
docs = ["mkdocs>=1.6.1"]
test = [
  "coverage>=7.13.5",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  # Capped until dynamist/phabfive#322, 0.16 widened the default rule set
  "ruff>=0.15.22,<0.16",
]
dev = [{ include-group = "test" }, "tox>=4.22", "tox-uv>=1.35.2"]

[project.scripts]
phabfive = "phabfive.cli:cli_entrypoint"

[project.urls]
Homepage = "https://github.com/dynamist/phabfive"
Download = "https://github.com/dynamist/phabfive/releases"

[tool.uv]
exclude-newer = "4 days"

[tool.hatch.build.targets.wheel]
packages = ["phabfive"]
