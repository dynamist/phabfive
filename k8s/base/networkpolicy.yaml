# Nothing reaches phorge pods except Traefik (to Phorge), Phorge (to MariaDB)
# and the dev applications that read Phorge over Conduit.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phorge-from-traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 80
---
# Conduit clients inside the cluster. Dynatron's standup reports search
# Phorge from the hub and the worker, and a pod cannot go out through
# Traefik to come back in: `phorge.localhost` resolves to the pod itself,
# and reaching Traefik's ClusterIP directly would mean pinning an address
# that changes when the cluster is recreated. So the clients are named
# here, where a destination's ingress belongs, rather than worked around
# at the caller, and they use PHAB_URL=http://web.phorge.svc.cluster.local/api/
# - PHORGE_ALLOWED_URIS is what makes Phorge answer to that name.
#
# Both the namespace and the pod must match, in one `from` entry. The
# namespace by `app.kubernetes.io/part-of: dynatron` rather than by name,
# because Dynatron runs one instance per git worktree - `dynatron` for the
# main checkout, `dynatron-<slug>` for each worktree - so a new worktree is
# admitted without a change here. The pod by name, because only the hub
# (`dynatron`) and the `worker` call Conduit, and the rest of an instance -
# its database, cache and object store - has no business on this port.
#
# Neither label proves anything. The API server sets
# `kubernetes.io/metadata.name`, but anyone who may edit namespaces can
# label one `part-of: dynatron`, and anyone who may create pods in an
# admitted namespace can name a pod `worker`. The pod selector narrows the
# grant; it does not authenticate the caller. In this local dev cluster
# those are the people who could edit this policy anyway, so it widens
# nothing real, but a production cluster would have to restrict who
# labels namespaces before trusting a policy like this one. Port 80 only,
# which is all Conduit uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: phorge-from-dev-apps
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: phorge
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: dynatron
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [dynatron, worker]
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-phorge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: phorge
      ports:
        - port: 3306
