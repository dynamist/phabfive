---
name: Kubernetes

on:
  pull_request:
    # labeled and unlabeled for ci:k8s and the ci:phorge-* labels
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches:
      - main
  # Phorge stable and master move without a commit here
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      versions:
        description: Phorge branches or tags to test, space separated, phabricator for Phabricator (blank for stable, master, the two newest releases and phabricator)
        required: false
        default: ""

# A label other than ci:k8s and ci:phorge-* gets a group of its own, so it does
# not cancel the running tests only to skip everything itself
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{
    contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) &&
    github.event.label.name != 'ci:k8s' && !startsWith(github.event.label.name, 'ci:phorge-') &&
    format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KUBECTL: mise exec -- kubectl --context k3d-dynamist

jobs:
  # Deploying costs about four minutes of k3d, and coexistence far more, so a
  # pull request only pays for it when it changes something that can break the
  # deployment, or when it carries the ci:k8s label.
  #
  # It also picks the Phorge versions the deploy matrix tests: stable, or the
  # refs of the ci:phorge-<branch or tag> labels on a pull request, which also
  # count as the manual override.
  #
  # The label, and not a /command comment, is deliberately the manual override:
  # it is sticky, so it survives later pushes and "Re-run failed jobs", it is
  # visible in the pull request header, and it keeps the safe pull_request
  # event. An issue_comment trigger would instead run the default branch's copy
  # of this file with a writable token, and report no check on the pull request.
  decide:
    name: Should we deploy?
    runs-on: ubuntu-latest
    # Other labels do not change what runs
    if: >-
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) ||
      github.event.label.name == 'ci:k8s' || startsWith(github.event.label.name, 'ci:phorge-')
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      # stable on every change, or the refs of the ci:phorge-* labels on a pull
      # request. Weekly, stable, master and the two newest releases, which
      # upstream tags YYYY.WW, so a new release needs no change here, and
      # Phabricator, which Phacility still hosts
      - name: Pick the Phorge versions
        id: versions
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT: ${{ inputs.versions }}
        run: |
          set -euo pipefail -o noglob

          if [ "$EVENT" = schedule ] || { [ "$EVENT" = workflow_dispatch ] && [ -z "$INPUT" ]; }; then
            releases=$(git ls-remote --tags --refs https://github.com/phorgeit/phorge.git |
              sed -n 's|.*refs/tags/||p' | grep -E '^[0-9]{4}\.[0-9]+$' | sort -V | tail -2)
            # shellcheck disable=SC2086
            versions=$(printf '%s\n' stable master $releases phabricator | jq -Rnc '[inputs]')
          elif [ "$EVENT" = workflow_dispatch ]; then
            # shellcheck disable=SC2086
            versions=$(printf '%s\n' $INPUT | jq -Rnc '[inputs]')
          else
            versions=$(jq -c '[.[]? | select(startswith("ci:phorge-")) | ltrimstr("ci:phorge-")]
              | if . == [] then ["stable"] else . end' <<<"$LABELS")
          fi

          # They end up in make and in check names, so only what a ref name needs
          if ! jq -e 'all(test("^[A-Za-z0-9][A-Za-z0-9._-]*$"))' <<<"$versions" >/dev/null; then
            echo "Not a Phorge branch or tag name in $versions" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Phorge versions: $versions" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "versions=$versions" >>"$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          # The reason goes to the log as well as the summary panel, so that
          # gh run view --log answers "why did this skip the deploy?" too
          decide() {
            echo "$2"
            echo "deploy=$1" >> "$GITHUB_OUTPUT"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          if [ "$EVENT" != pull_request ]; then
            decide true "Deploying: a $EVENT run is never gated."
          fi

          if label=$(jq -er 'map(select(. == "ci:k8s" or startswith("ci:phorge-"))) | first' <<<"$LABELS"); then
            decide true "$(printf 'Deploying: the pull request is labelled `%s`.' "$label")"
          fi

          if [ "$DRAFT" = true ]; then
            decide false 'Skipped: draft pull request. Mark it ready for review, or label it `ci:k8s`.'
          fi

          # Fail open. Four minutes wasted is cheaper than a deployment break
          # that reaches main because the API blipped and the gate said no.
          if ! changed=$(gh api "repos/$REPO/pulls/$NUMBER/files" --paginate --jq '.[].filename'); then
            decide true 'Deploying: could not list the changed files, so not guessing.'
          fi

          # Everything that changes what is deployed, or what the tests drive.
          # ci-test runs tests/k8s and tests/e2e, and the latter installs and
          # calls the CLI, which is why phabfive/ and the lock file are here.
          if hits=$(printf '%s\n' "$changed" | grep -E \
              -e '^(k8s|phorge|phabfive)/' \
              -e '^tests/(k8s|e2e)/' \
              -e '^(Makefile|mise\.toml|pyproject\.toml|uv\.lock)$' \
              -e '^scripts/[^/]+\.sh$' \
              -e '^\.github/workflows/k8s\.yml$'); then
            decide true "$(printf 'Deploying, because these changed files affect it:\n\n```\n%s\n```\n' "$hits")"
          fi

          decide false 'Skipped: nothing affecting the deployment changed. Label the PR `ci:k8s` to run it anyway.'

  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    # Other labels do not change what runs
    if: >-
      !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) ||
      github.event.label.name == 'ci:k8s' || startsWith(github.event.label.name, 'ci:phorge-')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: make validate

  deploy:
    name: Deploy and test Phorge ${{ matrix.version }} in k3d
    runs-on: ubuntu-latest
    needs: [validate, decide]
    if: needs.decide.outputs.deploy == 'true'
    timeout-minutes: 60
    # master is not released, its breakage is a heads-up rather than a failure
    continue-on-error: ${{ matrix.version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.decide.outputs.versions) }}
    env:
      VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Deploy
        run: make ci-deploy

      - name: Report the deployed Phorge
        run: |
          commit=$($KUBECTL -n phorge exec deploy/phorge -- git -C /app/phorge rev-parse HEAD)
          repo=$($KUBECTL -n phorge exec deploy/phorge -- printenv PHORGE_REPO)
          php=$($KUBECTL -n phorge exec deploy/phorge -- printenv PHP_VERSION)
          echo "$VERSION at [${commit:0:12}]($repo/commit/$commit) on PHP $php" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Do not depend on the runner's resolver for *.localhost
      - name: Resolve the ingress hostnames
        run: |
          hosts=$($KUBECTL get ingress -A -o jsonpath='{.items[*].spec.rules[*].host}')
          echo "127.0.0.1 $hosts nope.localhost" | sudo tee -a /etc/hosts

      - name: Test
        run: make ci-test

      - name: Collect diagnostics
        if: failure()
        run: &diagnostics |
          mkdir -p diagnostics
          $KUBECTL get all,ingress,pvc,netpol,events -A -o wide > diagnostics/resources.txt 2>&1 || true
          for ns in $($KUBECTL get ns -l dynamist.se/dev-app -o jsonpath='{.items[*].metadata.name}') kube-system; do
            $KUBECTL -n "$ns" describe pods > "diagnostics/$ns-pods.txt" 2>&1 || true
            for pod in $($KUBECTL -n "$ns" get pods -o name); do
              $KUBECTL -n "$ns" logs "$pod" --all-containers > "diagnostics/$ns-${pod#pod/}.log" 2>&1 || true
            done
          done

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k8s-diagnostics-${{ matrix.version }}
          path: diagnostics/

      # Which tests this Phorge version passes, pass or fail
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.version }}
          path: test-results/
          if-no-files-found: ignore

      - name: Delete cluster
        if: always()
        run: make destroy FORCE=1

  # Deploys the apps in the repository variable COEXISTENCE_REPOS (space
  # separated owner/name) into the same cluster, and runs every app's tests.
  # Each of them must provide the make targets ci-deploy and ci-test.
  coexistence:
    name: Coexistence with other apps in one cluster
    runs-on: ubuntu-latest
    needs: [validate, decide]
    if: vars.COEXISTENCE_REPOS != '' && needs.decide.outputs.deploy == 'true'
    timeout-minutes: 120
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: self

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          working_directory: self

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Check out the other apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for repo in ${{ vars.COEXISTENCE_REPOS }}; do
            gh repo clone "$repo" "apps/${repo#*/}" -- --depth 1
            # The cluster contract must be identical in every repo
            diff self/k8s/cluster/k3d.yaml "apps/${repo#*/}/k8s/cluster/k3d.yaml"
          done

      - name: Deploy all apps
        run: |
          make -C self ci-deploy
          for app in apps/*/; do mise install -C "$app" && make -C "$app" ci-deploy; done

      - name: Resolve the ingress hostnames
        working-directory: self
        run: |
          hosts=$($KUBECTL get ingress -A -o jsonpath='{.items[*].spec.rules[*].host}')
          echo "127.0.0.1 $hosts nope.localhost" | sudo tee -a /etc/hosts

      - name: Test all apps, including isolation from each other
        run: |
          make -C self ci-test
          for app in apps/*/; do make -C "$app" ci-test; done

      - name: Collect diagnostics
        if: failure()
        working-directory: self
        run: *diagnostics

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coexistence-diagnostics
          path: self/diagnostics/

      - name: Delete cluster
        if: always()
        run: make -C self destroy FORCE=1
