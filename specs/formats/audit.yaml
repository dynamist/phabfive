# One search spec, written four times: audit.yaml, audit.json, audit.jsonl
# and audit.toml. All four parse to the same spec.
#
#   phabfive search -f specs/formats/audit.yaml
#
# Two searches in one document, each naming what it searches and carrying
# its own result banner.
spec: phorge/v1alpha1
kind: search
metadata:
  name: audit
  description: The same search spec in YAML, JSON, JSONL and TOML.
  version: "1"
  author: phabfive

searches:
  - type: task
    title: Open work
    description: Everything still open, most recently touched first.
    search:
      status: open
      order: updated:desc
      limit: 25

  - type: project
    title: Active projects
    description: The projects that work could be tagged into.
    search:
      status: active
      milestones: false
      limit: 25
