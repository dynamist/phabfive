[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phabfive"
version = "0.11.0-rc.1"
description = "CLI for Phabricator and Phorge - built for humans and AI agents"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rickard Eriksson", email = "rickard@dynamist.se" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: English",
]
dependencies = [
  "anyconfig>=0.10.0",
  "appdirs>=1.4.0",
  # Imported directly by phabfive.cli.shell_completion. It used to arrive
  # through typer, which dropped it as a dependency in 0.27.
  "click>=8.0",
  "InquirerPy>=0.3.4",
  "jinja2>=3.0.0",
  "phabricator>=0.7.0",
  "pyyaml>=6.0",
  # Imported directly by phabfive.conduit, to translate connection errors
  # into PhabfiveConnectionException. It arrives through phabricator today,
  # which is not a promise it keeps.
  "requests>=2.26",
  "rich>=13.0.0",
  "ruamel-yaml>=0.18.0",
  # Imported directly by phabfive.spec.loader, to read a TOML spec. tomllib
  # is the same parser and is stdlib from 3.11 on; requires-python is 3.10.
  "tomli>=2.0; python_version < '3.11'",
  "typer>=0.12.0",
  # Imported directly by phabfive.retry, whose policy is a urllib3 Retry.
  # 1.26 is the first with allowed_methods and a per-kind `other` budget.
  "urllib3>=1.26",
]

[project.optional-dependencies]
repl = ["ptpython>=3.0.32"]

[dependency-groups]
docs = ["mkdocs>=1.6.1"]
test = [
  "coverage>=7.13.5",
  # A test oracle for phabfive.spec.schema, never a runtime dependency: the
  # offline validator is hand-rolled so it can name the field and the code a
  # frontend renders, and so the frozen builds stay free of a native wheel.
  "jsonschema>=4.23",
  "mypy>=2.3.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  # Capped until dynamist/phabfive#322, 0.16 widened the default rule set
  "ruff>=0.15.22,<0.16",
  # Unconditionally, unlike the runtime marker above: mypy runs with
  # python_version = "3.10", so it type checks the tomli branch of
  # phabfive.spec.loader whatever the interpreter running it is.
  "tomli>=2.0",
  "types-appdirs>=1.4.3.5",
  "types-pyyaml>=6.0.12.20260906",
  "types-requests>=2.33.0.20260906",
]
dev = [{ include-group = "test" }, "tox>=4.22", "tox-uv>=1.35.2"]

[project.scripts]
phabfive = "phabfive.cli:cli_entrypoint"

[project.urls]
Homepage = "https://github.com/dynamist/phabfive"
Download = "https://github.com/dynamist/phabfive/releases"

[tool.uv]
exclude-newer = "4 days"

[tool.hatch.build.targets.wheel]
packages = ["phabfive"]

# `uv run mypy` checks the package; CI runs it, and so does the pre-commit hook
[tool.mypy]
files = ["phabfive"]
# The oldest supported Python, so syntax only a newer one allows is caught
python_version = "3.10"
# What a consumer's mypy applies to `from phabfive import X`, so the package
# is checked the same way: a name re-exported without __all__ or `as X` fails
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Ship neither inline types nor stubs, and there are none on PyPI. Listed
# by name so that a missing stub for anything else is still an error.
# ptpython is the optional `repl` extra, absent unless it was installed.
[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["phabricator", "ptpython", "ptpython.*"]
